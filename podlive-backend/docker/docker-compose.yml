services:
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      NODE_ENV: production
      PORT: 5005
      DATABASE_URL: postgresql://podlive_user:podlive_password@db:5432/podlive
      DIRECT_URL: postgresql://podlive_user:podlive_password@db:5432/podlive
      REDIS_URL: redis://redis:6379
    ports:
      - "5005:5005"
    depends_on:
      - db
      - redis
    volumes:
      - uploads_data:/app/uploads

  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: podlive_user
      POSTGRES_PASSWORD: podlive_password
      POSTGRES_DB: podlive
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    restart: always
    ports:
      - "6379:6379"

volumes:
  postgres_data:
  uploads_data:
